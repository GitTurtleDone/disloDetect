name: Deploy .NET to Azure Functions

on:
  push:
    branches: [az-deploy]
    paths:
      - "dislodetect_be/**"
      - ".github/workflows/az-deploy-dotnet.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore dependencies
        run: dotnet restore dislodetect_be/dislodetect_be.csproj

      - name: Build
        run: dotnet build dislodetect_be/dislodetect_be.csproj --no-restore

      - name: Run tests
        run: dotnet test dislodetect_be/dislodetect_be.csproj --no-build --verbosity normal

  deploy:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish
        run: dotnet publish dislodetect_be/dislodetect_be.csproj -c Release -o ./publish

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZ_CREDENTIALS }}

      - name: Deploy to Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ secrets.AZ_DOTNET_FUNCTION_NAME }}
          package: ./publish
