name: Deploy Python to Azure Functions

on:
  push:
    branches: [az-deploy]
    paths:
      - "dislodetect_pybe/**"
      - ".github/workflows/az-deploy-python.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dislodetect_pybe
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install test dependencies
        run: pip install azure-functions pytest numpy Pillow azure-storage-blob

      - name: Run tests
        run: pytest tests/test_app.py -v

  deploy:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZ_CREDENTIALS }}

      - name: Deploy to Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ secrets.AZ_PYTHON_FUNCTION_NAME }}
          package: dislodetect_pybe
          scm-do-build-during-deployment: true
          enable-oryx-build: true
